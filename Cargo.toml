[package]
name = "drover"
version = "0.1.4"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "fs", "net", "io-util"] }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
must_use_candidate = "warn"
clone_on_ref_ptr = "deny"
allow_attributes = "deny"
