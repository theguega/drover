[package]
name = "drover"
version = "0.1.20"
edition = "2024"
rust-version = "1.91"
description = "Agent runtime for coding agents: runs Claude Code, Cursor and pi in git worktrees, in herdr panes or headless, and carries their approvals"
license = "MIT"
repository = "https://github.com/theguega/drover"
readme = "README.md"
keywords = ["agents", "claude", "herdr", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "fs", "net", "io-util"] }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
must_use_candidate = "warn"
clone_on_ref_ptr = "deny"
allow_attributes = "deny"
